name: Set lineup

on:
  workflow_dispatch:       # manual only: started by the Set lineup button on the dashboard
    inputs:
      dry_run:
        description: "Plan only, do not save to ESPN"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  lineup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy
      - name: Set lineup on ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python setlineup.py
      - name: Refresh dashboard data
        if: always()
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.name "courtside-bot"
          git config user.email "courtside-bot@users.noreply.github.com"
          git add data.json lineup_log.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Set lineup and refresh" && git pull --rebase -q && git push)
