name: Refresh ESPN data

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour, off the busy :00/:30 marks (GitHub may still delay)
  workflow_dispatch:          # "Run workflow" button for an instant refresh
  push:
    paths: ["fetch.py", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scipy
      - name: Pull league from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python fetch.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "courtside-bot"
          git config user.email "courtside-bot@users.noreply.github.com"
          for f in data.json highlights.json season.json weekbase.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Refresh ESPN data" && git pull --rebase --autostash -q && git push)
